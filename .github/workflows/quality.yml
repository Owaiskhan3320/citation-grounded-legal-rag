name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate legal source records
        run: python scripts/validate_corpus.py

      - name: Test data checks and case curation pipeline
        run: python -m unittest discover -s tests -v

      - name: Test statute retrieval and RAG contracts
        run: |
          node scripts/test-search.mjs
          node scripts/test-rag.mjs
          node scripts/test-api.mjs
          node scripts/test-corpus.mjs
          node scripts/test-issues.mjs
          node --check app.js
